name: Build Torchlight II IPA

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      survey_only:
        description: Run the NX2Apple survey without producing an IPA
        required: false
        default: false
        type: boolean
      publish_ipa:
        description: Upload the slim IPA to the public Actions artifact (RomFSARC stays local)
        required: false
        default: true
        type: boolean
      resource_release:
        description: Release tag containing encrypted resource parts
        required: true
        type: string

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate public build contract
        run: |
          python -m py_compile scripts/*.py
          python scripts/validate_build_contract.py
          git diff --check

  build:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: portable
    runs-on: macos-26
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate public tree
        run: python3 scripts/validate_public_tree.py

      - name: Apply NX2Apple ROMFSARC segment patch
        run: python3 scripts/apply_nx2apple_patches.py --patch patches/nx2apple-jumptable.patch --patch patches/nx2apple-romfsarc-global-shards.patch --patch patches/nx2apple-drawtexture-nop.patch --patch patches/nx2apple-enc-thread-off.patch --patch patches/nx2apple-res-check.patch --patch patches/nx2apple-fs-logging.patch --debug-jumptable

      - name: Compile and run segmented ROMFSARC reader test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ['RUNNER_TEMP']) / 'romfs-reader-fixture'
          (root / 'PAKS').mkdir(parents=True, exist_ok=True)
          (root / 'MUSIC').mkdir(parents=True, exist_ok=True)
          (root / 'PAKS' / 'DATA.PAK').write_bytes(bytes(range(251)) * 12000)
          (root / 'MUSIC' / 'small.ogg').write_bytes(b'OggS' + bytes(range(127)) * 17)
          PY
          python3 scripts/pack_romfs_for_iphone.py --romfs "$RUNNER_TEMP/romfs-reader-fixture" --output "$RUNNER_TEMP/romfs-reader-archive" --shard-mib 1
          clang -I vendor/nx2apple/dm/host \
            vendor/nx2apple/dm/host/tests/t_romfs_arc.c \
            vendor/nx2apple/dm/host/romfs_arc.c \
            -lpthread -o "$RUNNER_TEMP/t_romfs_arc"
          "$RUNNER_TEMP/t_romfs_arc" "$RUNNER_TEMP/romfs-reader-archive/romfs"

      - name: Install NX2Apple/nxnative dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang
          brew install --cask dotnet-sdk
          python3 -m venv "$RUNNER_TEMP/torchlight2-venv"
          "$RUNNER_TEMP/torchlight2-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/torchlight2-venv/bin/python" -m pip install lz4 capstone fonttools zstandard pycryptodome cryptography enlighten "backports.zstd; python_version < '3.14'"
          echo "$RUNNER_TEMP/torchlight2-venv/bin" >> "$GITHUB_PATH"

      - name: Build from local resources
        env:
          GH_TOKEN: ${{ github.token }}
          TORCHLIGHT2_RESOURCE_KEY: ${{ secrets.TORCHLIGHT2_RESOURCE_KEY }}
          TORCHLIGHT2_PROD_KEYS: ${{ secrets.TORCHLIGHT2_PROD_KEYS }}
          TL2_DEBUG_JUMPTABLE: "1"
          TL2_JUMPTABLE_LOG: ${{ runner.temp }}/torchlight2-jumptable.log
        run: |
          test -n "$TORCHLIGHT2_RESOURCE_KEY"
          test -n "$TORCHLIGHT2_PROD_KEYS"
          mkdir -p "$RUNNER_TEMP/torchlight2-cloud-resources"
          gh release download "${{ inputs.resource_release }}" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/torchlight2-cloud-resources"
          python3 scripts/encrypt_resource_release.py open "$RUNNER_TEMP/torchlight2-cloud-resources" "$RUNNER_TEMP/torchlight2-resource-parts"
          printf '%s' "$TORCHLIGHT2_PROD_KEYS" > "$RUNNER_TEMP/torchlight2-prod.keys"
          TORCHLIGHT2_PARTS="$RUNNER_TEMP/torchlight2-resource-parts"
          TORCHLIGHT2_KEYS="$RUNNER_TEMP/torchlight2-prod.keys"
          python3 scripts/assemble_resources.py "$TORCHLIGHT2_PARTS/manifest.json" --output-dir "$RUNNER_TEMP/torchlight2-resources"
          python3 scripts/normalize_switch_inputs.py --resources "$RUNNER_TEMP/torchlight2-resources" --output "$RUNNER_TEMP/torchlight2-normalized" --keys "$TORCHLIGHT2_KEYS"
          args=(--resources "$RUNNER_TEMP/torchlight2-normalized" --keys "$TORCHLIGHT2_KEYS" --backend nx2apple --work-dir "$RUNNER_TEMP/torchlight2-work" --out "$RUNNER_TEMP/TorchlightIIMobile.ipa")
          if [ "${{ inputs.survey_only }}" = "true" ]; then args+=(--survey-only); fi
          python3 scripts/build_local_ipa.py "${args[@]}"

      - name: Pack local RomFS for iPhone
        if: ${{ !inputs.survey_only }}
        run: |
          romfs=$(find "$RUNNER_TEMP/torchlight2-work" -type d -name RomFS -print | sort | tail -n 1)
          test -n "$romfs"
          python3 scripts/pack_romfs_for_iphone.py --romfs "$romfs" --output "$RUNNER_TEMP/torchlight2-romfs" --shard-mib 476
          echo "ROMFSARC remains local at $RUNNER_TEMP/torchlight2-romfs"

      - name: Validate IPA structure
        if: ${{ !inputs.survey_only }}
        run: python3 scripts/validate_ipa.py "$RUNNER_TEMP/TorchlightIIMobile.ipa"

      - name: Upload optional public artifact
        if: ${{ !inputs.survey_only && inputs.publish_ipa }}
        uses: actions/upload-artifact@v4
        with:
          name: torchlight2-ios-build
          path: |
            ${{ runner.temp }}/TorchlightIIMobile.ipa
            ${{ runner.temp }}/torchlight2-work/**/survey.md
            ${{ runner.temp }}/torchlight2-work/**/*.log
          if-no-files-found: warn

      - name: Keep IPA local by default
        if: ${{ !inputs.survey_only && !inputs.publish_ipa }}
        run: echo "IPA remains on the hosted runner at $RUNNER_TEMP/TorchlightIIMobile.ipa"

      - name: Upload jump table diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torchlight2-jumptable-diagnostics
          path: ${{ runner.temp }}/torchlight2-jumptable.log
          if-no-files-found: ignore

      - name: Remove decrypted build inputs
        if: always()
        run: rm -rf "$RUNNER_TEMP/torchlight2-cloud-resources" "$RUNNER_TEMP/torchlight2-resource-parts" "$RUNNER_TEMP/torchlight2-resources" "$RUNNER_TEMP/torchlight2-normalized" "$RUNNER_TEMP/torchlight2-prod.keys"
